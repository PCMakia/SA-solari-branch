[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sleeper-agent-mcp"
version = "0.2.0"
description = "Sleeper AFK overseer MCP server (local Cursor + Solari)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0.0",
    "pydantic>=2.0.0",
    "psutil>=5.9.0",
    "solari-sandbox>=0.1.0",
    "solari-browser>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
sleeper-agent-mcp = "sleeper_agent_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sleeper_agent_mcp*"]
